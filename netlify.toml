# Root Netlify configuration: this repo's Netlify site builds the Phoenix app.
# Fully self-contained on purpose — it overrides ALL of the site's dashboard
# build settings (which previously built other apps from this repo), so the
# deploy is deterministic regardless of leftover UI configuration.
# ANTHROPIC_API_KEY comes from the site's environment variables.

[build]
  base = "phoenix"
  command = "npm run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Force devDependency install even if a NODE_ENV=production var lingers
  # from the site's previous life.
  NODE_ENV = "development"
  NPM_FLAGS = "--include=dev"
  # If the Next.js build plugin is still installed on the site from the old
  # app, make it a no-op — Phoenix is a Vite app.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: let the client handle its own view state.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
