name: Diagnose the Advocate

# Asks the live Advocate a real, heavy question and reports exactly how the
# answer ended: how long it took, how much came back, and what the last words
# were. Written because she was shown "Good. Now here is the answer." and then
# nothing — and the two candidate causes (the model hitting its token ceiling
# vs. the function being killed mid-stream) need opposite fixes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "chat (conversation) or scan (one Deep Scan part)"
        required: false
        default: "chat"
      question:
        description: "Question to ask the live Advocate"
        required: false
        default: >-
          He says he will take her from me and that no court will believe me
          because of what he has told them about my mental health. Can he
          actually get custody of my daughter in Texas?

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the live Advocate and time the answer
        run: |
          URL="https://phoenix-case-builder.netlify.app/api/advocate"
          # Deep Scan is the mode that failed 63 out of 63 parts. Testing it
          # here means she is never the one who finds out it is broken.
          if [ "${{ inputs.mode }}" = "scan" ]; then
            Q=$(jq -Rn '{
              mode:"scan", webSearch:false,
              messages:[{role:"user",content:(
                "Return ONLY strict JSON: {\"incidents\":[{\"date\":\"YYYY-MM-DD\",\"summary\":\"...\"}]}\n\n" +
                "2024-03-02 him: if you take her I will make sure you never see her again\n" +
                "2024-03-02 me: please stop\n" +
                "2024-03-05 him: no court will believe a word you say\n")}]}')
          else
            Q=$(jq -Rn --arg q "${{ inputs.question }}" '{messages:[{role:"user",content:$q}]}')
          fi

          # WHO is refusing? A usage error can come from Netlify (the site), from
          # the function, or from Anthropic upstream. The response headers name
          # the source, and the site root tells us whether the whole site is
          # blocked or only the API.
          echo "=================== WHO IS ANSWERING ================="
          echo "--- GET / (site root) ---"
          curl -s -o /tmp/root.txt -D /tmp/root.hdr -w 'HTTP %{http_code}\n' -m 30 \
            "https://phoenix-case-builder.netlify.app/" || echo "request failed"
          grep -iE '^(HTTP/|server|x-nf|x-powered|content-type|x-request-id|retry-after)' /tmp/root.hdr || true
          echo "--- first 200 bytes of root ---"; head -c 200 /tmp/root.txt; echo
          echo
          echo "--- POST /api/advocate (headers) ---"
          curl -s -o /tmp/api.txt -D /tmp/api.hdr -w 'HTTP %{http_code}\n' -m 60 -X POST \
            -H 'content-type: application/json' \
            --data '{"messages":[{"role":"user","content":"Say OK."}]}' \
            "$URL" || echo "request failed"
          grep -iE '^(HTTP/|server|x-nf|x-powered|content-type|x-request-id|retry-after|anthropic)' /tmp/api.hdr || true
          echo "--- body ---"; head -c 300 /tmp/api.txt; echo
          echo "====================================================="
          echo

          start=$(date +%s.%N)
          code=$(curl -s -N -o /tmp/ans.txt -w '%{http_code}' -m 300 -X POST \
            -H 'content-type: application/json' --data "$Q" "$URL" || echo "000")
          end=$(date +%s.%N)

          secs=$(echo "$end - $start" | bc)
          bytes=$(wc -c < /tmp/ans.txt)
          echo "HTTP $code · ${secs}s · ${bytes} bytes"
          echo
          echo "=================== LAST 600 BYTES ==================="
          tail -c 600 /tmp/ans.txt; echo
          echo "======================================================"
          echo
          echo "=================== FIRST 400 BYTES =================="
          head -c 400 /tmp/ans.txt; echo
          echo "======================================================"

          # An answer that stops without terminal punctuation is a truncation,
          # not a conclusion.
          # Strip the clean-finish marker before judging: it is the LAST byte of
          # a complete answer, so leaving it in makes every good answer look
          # truncated.
          if tail -c 1 /tmp/ans.txt | od -An -tx1 | grep -q '04'; then
            echo "clean-finish marker present — the server ended this on purpose"
            head -c -1 /tmp/ans.txt > /tmp/ans.trim
          else
            echo "NO clean-finish marker — the stream died"
            cp /tmp/ans.txt /tmp/ans.trim
          fi
          last=$(tr -d '[:space:]' < /tmp/ans.trim | tail -c 1)
          echo "last non-space character: '$last'"
          case "$last" in
            .|!|\?|\)|\"|\'|:|\;) echo "VERDICT: ends like a finished sentence" ;;
            *) echo "VERDICT: TRUNCATED — ends mid-thought" ;;
          esac

          # Which cause? A wall-clock cliff points at the function being killed;
          # a longer run that stops mid-sentence points at the token ceiling.
          whole=${secs%.*}
          if [ "$whole" -le 11 ]; then
            echo "TIMING: died at ~10s — consistent with the function being killed"
          elif [ "$whole" -le 27 ]; then
            echo "TIMING: died at ~26s — consistent with the function being killed"
          else
            echo "TIMING: ran ${secs}s — past the usual function limits"
          fi
