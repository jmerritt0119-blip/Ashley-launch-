name: Probe Advocate

# Sends ONE real request to the live /api/advocate and prints exactly what
# comes back.
#
# This exists because the container the assistant works in cannot reach
# phoenix-case-builder.netlify.app — outbound access to it is blocked — so
# every question about what the live endpoint is actually doing has otherwise
# been answered by inference. Inference is what turned a dead account into a
# hunt for a timeout, twice in one day.
#
# It builds the request with the app's OWN buildScanPrompt, at the size a real
# scan part uses. That matters: a short hand-written prompt succeeds under
# conditions a real part fails under, because what times a request out is how
# long the model spends reading ~8,000 tokens of instructions before it emits
# its first character. A probe that skips the instructions cannot see the bug.
#
# Ten items are planted in the document and the reply is scored against them,
# so the output is a number someone can disagree with rather than a vibe.
#
# One request per run.

on:
  push:
    paths:
      - ".github/probe-request.txt"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to ask for"
        required: false
        default: "claude-opus-5"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the request using the app's own scan prompt
        env:
          MODEL: ${{ inputs.model || 'claude-opus-5' }}
        working-directory: phoenix
        run: |
          cat > /tmp/build.mjs <<'JS'
          import { register } from "node:module";
          import { pathToFileURL } from "node:url";
          import { writeFileSync } from "node:fs";
          register("./ts-hooks.mjs", pathToFileURL(process.cwd() + "/tools/"));
          const { buildScanPrompt, SCAN_CHUNK_SIZE, SCAN_MODEL } = await import(
            process.cwd() + "/src/scan.ts"
          );

          // Ordinary logistics, at the density a real archive has.
          const filler = [
            "can you grab milk", "running late", "ok", "she has soccer at 6",
            "did you pay the water bill", "k", "I'll be home after 9",
            "don't forget her inhaler", "on my way", "sounds good",
          ];
          // Ten things worth finding, written the way people actually write
          // them — obliquely, referring to what both already know.
          const planted = [
            ["2024-03-02 23:41", "Jackson", "you know I could put my hands on your neck again if you keep this up"],
            ["2024-03-09 19:12", "Jackson", "keep talking about lawyers and you will not see Emma again, I promise you that"],
            ["2024-03-15 21:03", "Jackson", "the thing in the closet is loaded now so think twice"],
            ["2024-03-21 12:44", "Jackson", "cleared 4200 cash on the side job this month, dont tell anyone"],
            ["2024-03-28 17:30", "Jackson", "she is moving in on the 3rd, get your stuff out of the closet"],
            ["2024-04-04 14:02", "Jackson", "paid her girl's daycare again, thats 900 gone, so no I cant do your car"],
            ["2024-04-08 22:15", "Jackson", "I know you were at your sisters till 8:40, dont lie to me"],
            ["2024-04-11 02:07", "Me", "I'm sitting in the bathroom with the door locked because I'm scared"],
            ["2024-04-16 08:22", "Jackson", "I cant take her Wednesdays or Thursdays, I work late, thats on you"],
            ["2024-04-19 20:55", "Jackson", "your mother is not welcome here again and I mean it this time"],
          ];

          const lines = [];
          let p = 0, day = 1;
          while (lines.join("\n").length < SCAN_CHUNK_SIZE - 400) {
            const d = String((day % 28) + 1).padStart(2, "0");
            for (let h = 8; h <= 20; h += 4) {
              lines.push(`2024-04-${d} ${String(h).padStart(2, "0")}:0${day % 10} Me: ${filler[(day + h) % filler.length]}`);
              lines.push(`2024-04-${d} ${String(h).padStart(2, "0")}:1${day % 10} Jackson: ${filler[(day + h + 3) % filler.length]}`);
            }
            if (p < planted.length && day % 3 === 0) {
              const [ts, who, msg] = planted[p++];
              lines.push(`${ts} ${who}: ${msg}`);
            }
            day++;
          }
          // Any planted item not yet placed still goes in.
          while (p < planted.length) {
            const [ts, who, msg] = planted[p++];
            lines.push(`${ts} ${who}: ${msg}`);
          }
          const doc = lines.join("\n");

          const prompt = buildScanPrompt(doc, { index: 1, total: 1 }, {
            his: "Jackson",
            others: "her daughter",
          });
          const body = {
            mode: "scan",
            model: process.env.MODEL || SCAN_MODEL,
            webSearch: false,
            messages: [{ role: "user", content: prompt }],
          };
          writeFileSync("/tmp/body.json", JSON.stringify(body));
          console.log("document:   " + doc.length.toLocaleString() + " chars (part size " + SCAN_CHUNK_SIZE.toLocaleString() + ")");
          console.log("full prompt:" + prompt.length.toLocaleString() + " chars — this is what the browser sends");
          console.log("model:      " + body.model);
          JS
          node --experimental-strip-types /tmp/build.mjs

      - name: Ask the live endpoint and grade the answer
        env:
          URL: https://phoenix-case-builder.netlify.app
        run: |
          set -u
          echo "--- POST $URL/api/advocate ---"
          start=$(date +%s)
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -m 600 \
            -X POST -H 'content-type: application/json' \
            --data @/tmp/body.json \
            "$URL/api/advocate" || echo "000")
          echo "HTTP $code after $(( $(date +%s) - start ))s"
          echo "bytes returned: $(wc -c < /tmp/out.txt)"

          if grep -qP '\x06' /tmp/out.txt; then
            echo "keep-alive bytes present: yes (the connection was held open)"
          else
            echo "keep-alive bytes present: no"
          fi
          if grep -qP '\x04' /tmp/out.txt; then
            echo "clean finish: yes"
          else
            echo "clean finish: NO — the stream was cut off"
          fi

          echo "--- graded against the ten planted items ---"
          python3 - <<'PY'
          import json
          raw = open("/tmp/out.txt", encoding="utf-8", errors="replace").read()
          raw = raw.replace("\x04", "").replace("\x06", "")
          start = raw.find("{")
          if start < 0:
              print("NOT A CATALOG — the endpoint returned prose or an error:")
              print("   " + raw[:300])
              raise SystemExit(0)
          try:
              obj = json.loads(raw[start:])
          except Exception as e:
              print("catalog did not parse:", e)
              print("   tail:", raw[-200:])
              raise SystemExit(0)
          for k in ("incidents", "flaggedMessages", "riskIndicators", "caseFacts", "impliedFindings"):
              print(f"{k}: {len(obj.get(k) or [])}")
          blob = json.dumps(obj).lower()
          checks = {
              "1  strangulation": "neck",
              "2  threat to take the child": "emma",
              "3  weapon": "loaded",
              "4  cash income": "4200",
              "5  girlfriend moved in": "moving in on the 3rd",
              "6  money spent on her child": "900",
              "7  tracking her": "8:40",
              "8  her own fear": "locked",
              "9  contradicts 50/50": "wednesday",
              "10 isolation": "mother is not welcome",
          }
          found = 0
          for label, needle in checks.items():
              hit = needle in blob
              found += hit
              print(("  FOUND   " if hit else "  MISSED  ") + label)
          print(f"\nscore: {found}/10 planted items quoted back")
          print("\nsummary the model wrote:")
          print("  " + (obj.get("summary") or "(none)")[:400])
          PY
